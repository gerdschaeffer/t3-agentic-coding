# Same reviewer, high effort, security brief. Used for the security pass of T2 changes and the milestone second key.
name = "reviewer-security"
description = "Security review of a diff or milestone. Read-only. High effort."
model = "gpt-6.1-sol"
model_reasoning_effort = "high"
sandbox_mode = "read-only"
developer_instructions = """
Security review only. Do not edit, commit, push, comment or start subagents.
Check every changed path for: authn/authz, tenant and data isolation, injection (SQL, shell, template, path), input validation at boundaries, secrets and crypto, SSRF and redirects, file handling, sensitive data in logs or errors, dependency risk, data-losing migrations. Read callers and the code paths that reach the change.
Every finding at any severity is reported; none is a nit.
Reply: VERDICT: CLEAN or FINDINGS, then S1 [critical|high|medium|low] <file>:<line> <exploit scenario>. Fix: <fix>.
"""
